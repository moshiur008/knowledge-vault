<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Knowledge Vault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <header>
      <div class="container header-container">
        <div class="logo">
          <a href="./"
            ><img src="./images/logo-navbar.png" alt="Knowledge Vault"
          /></a>
        </div>
        <nav class="main-nav">
          <ul>
            <li><a href="#">Features</a></li>
            <li><a href="#">How It Works</a></li>
            <li><a href="#">Why It's Different</a></li>
          </ul>
        </nav>
        <button class="btn btn-primary">Get Early Access</button>
      </div>
    </header>
    <section id="hero">
      <div class="container">
        <div class="hero-content">
          <div class="hero-sub-heading">
            <span></span>
            <p>Early Access Now Open</p>
          </div>
          <h1 class="hero-heading">
            Structured thinking, <span>not just note-taking.</span>
          </h1>
          <p class="hero-text">
            A private space to store notes, links, and learning summaries —
            designed to help you think clearly, connect ideas, and turn learning
            into long-term knowledge.
          </p>
          <div class="hero-btns">
            <button class="btn btn-primary">
              Start Building Your Vault <i class="fa-solid fa-arrow-right"></i>
            </button>
            <button class="btn btn-secondary">
              <i class="fa-solid fa-play"></i> Get Early Access
            </button>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
